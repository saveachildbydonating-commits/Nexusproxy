services:
  - type: web
    name: nexusproxy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nexusproxy-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: COINBASE_COMMERCE_API_KEY
        sync: false
databases:
  - name: nexusproxy-db
    plan: free
    databaseName: nexusproxy
    user: nexusproxy
